services:
  web:
    build: .
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2G
    environment:
      WEB_CONCURRENCY: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
  jobs:
    build: .
    depends_on: [web]
    command: bin/jobs
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
